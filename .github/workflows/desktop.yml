# ZenMusic Desktop — CI build.
# Every push to main: builds the Windows exe with the DESKTOP entrypoint
# (never the mobile entry — audio_service has no Windows implementation)
# and uploads the build folder as a downloadable artifact for testers.
#
# Testers: download the artifact from the run page (browser unzips it),
# run zenmusic.exe. First launch may be slow (extracts mpv/native libs).

name: Desktop Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true # report but don't block — tighten at release

      # Path deps (packages/just_audio, packages/youtube_explode_dart) resolve
      # from the checkout itself; no extra step needed. Native mobile modules
      # (lossless/, innertube/, etc.) are irrelevant to the Windows build.

      - name: Build Windows exe (desktop entrypoint)
        run: flutter build windows --release -t lib/desktop/main.dart

      - name: Upload build folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenMusic-Desktop-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 30