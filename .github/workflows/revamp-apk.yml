name: Revamp APK

# Builds installable APKs for the revamp branch on every push.
# Download them from the run's "Artifacts" section.
on:
  push:
    branches: ['revamp/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Analyze (report only)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          {
            echo '## flutter analyze errors'
            echo '```'
            grep -E '^\s*error ' analyze.txt | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*error ' analyze.txt | head -10 | while read -r line; do
            echo "::error title=analyze::$line"
          done || true
      - name: Build split APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.txt
      - name: Report build failure
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -nE 'error|Error|FAILED|Exception|e: ' build.txt | grep -v 'Warning' | head -120 || true
            echo '```'
            echo '## Build log tail'
            echo '```'
            tail -n 120 build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "(error|Error|e: file)" build.txt | head -10 | while read -r line; do
            echo "::error title=build::$line"
          done || true
      - run: flutter build apk --release
      - name: Collect APKs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/zenmusic-revamp-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/zenmusic-revamp-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/zenmusic-revamp-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zenmusic-revamp-apks
          path: out/*.apk
