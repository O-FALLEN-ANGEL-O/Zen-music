name: Revamp APK

# Builds installable APKs for the revamp branch on every push.
# Download them from the run's "Artifacts" section.
on:
  push:
    branches: ['revamp/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - name: Collect APKs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/zenmusic-revamp-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/zenmusic-revamp-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/zenmusic-revamp-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zenmusic-revamp-apks
          path: out/*.apk
