<svg xmlns="http://www.w3.org/2000/svg" width="720" height="427" viewBox="0 0 720 427" role="img" aria-label="Build ZenMusic from source" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Build ZenMusic from source</title>
  <defs>
    <clipPath id="card"><rect width="720" height="427" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="720" height="427" fill="#140A1F"/>
    <rect width="720" height="44" fill="#1E1230"/>
    <rect y="43" width="720" height="1" fill="#E63CFF" opacity="0.25"/>
    <circle cx="28" cy="22" r="7" fill="#E63CFF"/>
    <circle cx="50" cy="22" r="7" fill="#2FB8A6"/>
    <circle cx="72" cy="22" r="7" fill="#F9D1FF"/>
    <text x="360" y="27" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="13" fill="#B9A6CC">zen-music — bash</text>
  </g>
  <rect x="1" y="1" width="718" height="425" rx="15" fill="none" stroke="#E63CFF" stroke-opacity="0.45" stroke-width="2"/>
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="15">
    <text x="32" y="78" xml:space="preserve"><tspan fill="#2FB8A6"># 1. get the code</tspan></text>
    <text x="32" y="105" xml:space="preserve"><tspan fill="#E63CFF">$ </tspan><tspan fill="#FFFFFF">git clone </tspan><tspan fill="#FFD9FF">https://github.com/vorlon-dev/Zen-music.git</tspan></text>
    <text x="32" y="132" xml:space="preserve"><tspan fill="#E63CFF">$ </tspan><tspan fill="#FFFFFF">cd </tspan><tspan fill="#F9D1FF">Zen-music</tspan></text>
    <text x="32" y="159" xml:space="preserve"><tspan fill="#E63CFF">$ </tspan><tspan fill="#FFFFFF">flutter </tspan><tspan fill="#F9D1FF">pub get</tspan></text>
    <text x="32" y="200" xml:space="preserve"><tspan fill="#2FB8A6"># 2. Android</tspan></text>
    <text x="32" y="227" xml:space="preserve"><tspan fill="#E63CFF">$ </tspan><tspan fill="#FFFFFF">flutter </tspan><tspan fill="#F9D1FF">run</tspan></text>
    <text x="32" y="254" xml:space="preserve"><tspan fill="#E63CFF">$ </tspan><tspan fill="#FFFFFF">flutter </tspan><tspan fill="#F9D1FF">build apk </tspan><tspan fill="#F59BFF">--release --split-per-abi</tspan></text>
    <text x="32" y="295" xml:space="preserve"><tspan fill="#2FB8A6"># 3. Windows desktop (needs the Visual Studio C++ workload)</tspan></text>
    <text x="32" y="322" xml:space="preserve"><tspan fill="#E63CFF">$ </tspan><tspan fill="#FFFFFF">flutter </tspan><tspan fill="#F9D1FF">run </tspan><tspan fill="#F59BFF">-d </tspan><tspan fill="#F9D1FF">windows </tspan><tspan fill="#F59BFF">-t </tspan><tspan fill="#F9D1FF">lib/desktop/main.dart</tspan></text>
    <text x="32" y="349" xml:space="preserve"><tspan fill="#E63CFF">$ </tspan><tspan fill="#FFFFFF">flutter </tspan><tspan fill="#F9D1FF">build windows </tspan><tspan fill="#F59BFF">--release -t </tspan><tspan fill="#F9D1FF">lib/desktop/main.dart</tspan></text>
    <text x="32" y="390" fill="#E63CFF">$ </text>
    <rect x="50.1" y="376" width="9" height="18" fill="#F9D1FF"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
